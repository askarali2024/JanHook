<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>JanHook — Webhook Inspector</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M20 7v11a6 6 0 0 1-12 0v-2' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ======================= Header bar ======================= -->
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="16.5" cy="4.2" r="1.3" fill="currentColor" stroke="none"></circle>
          <path d="M16.5 5.5V14a6 6 0 0 1-12 0v-1.8"></path>
          <path d="M4.5 12.2 2.7 14M4.5 12.2l1.8 1.8"></path>
        </svg>
      </span>
      <span class="brand-name">JanHook</span>
      <span class="status-badge" id="statusBadge" title="Live connection to the JanHook server">
        <span class="dot"></span>
        <span id="statusText">Connecting…</span>
      </span>
    </div>
    <div class="topbar-actions">
      <select id="endpointSelect" aria-label="Active endpoint" title="Switch endpoint"></select>
      <button class="btn btn-primary" id="newEndpointBtn" title="Create a new webhook endpoint">+ New Endpoint</button>
      <button class="btn btn-ghost" id="copyUrlBtn" title="Copy the active webhook URL">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Copy URL
      </button>
    </div>
  </header>

  <main class="layout">

    <!-- ======================= Active endpoint banner ======================= -->
    <section class="card banner">
      <div class="banner-row">
        <div class="field grow">
          <label class="field-label" for="hookUrl">Webhook URL</label>
          <div class="url-line">
            <code class="mono" id="hookUrl">—</code>
            <button class="icon-btn" id="copyHookUrlBtn" title="Copy webhook URL" aria-label="Copy webhook URL">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary" id="sendTestBtn" title="POST a sample JSON payload to this endpoint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          Send Test Webhook
        </button>
      </div>

      <div class="banner-row">
        <div class="field grow">
          <label class="field-label">Quick test command</label>
          <div class="url-line">
            <code class="mono" id="curlPreview">—</code>
            <button class="icon-btn" id="copyCurlBtn" title="Copy curl command" aria-label="Copy curl command">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="banner-row response-row">
        <span class="field-label">Response config</span>
        <select id="respStatus" title="HTTP status returned to callers" aria-label="Response status code">
          <option value="200">200</option>
          <option value="201">201</option>
          <option value="202">202</option>
          <option value="400">400</option>
          <option value="500">500</option>
        </select>
        <input type="text" id="respBody" class="mono resp-body-input" placeholder='{"ok": true}' spellcheck="false" autocomplete="off" aria-label="Response JSON body">
        <button class="btn btn-ghost sm" id="saveRespBtn">Save</button>
        <span class="hint">status + JSON body returned to every caller of <code class="mono">/h/&lt;slug&gt;</code></span>
        <span class="grow"></span>
        <button class="btn btn-danger-ghost sm" id="deleteEndpointBtn" data-armed="false">Delete endpoint</button>
      </div>
    </section>

    <!-- ======================= Split-pane workspace ======================= -->
    <section class="workspace">

      <!-- Left: incoming requests feed -->
      <aside class="card feed">
        <div class="feed-header">
          <input type="text" id="filterInput" placeholder="Filter by method or text…" autocomplete="off" spellcheck="false" title="Press / to focus">
          <span class="count-pill" id="requestCount" title="Captured requests">0</span>
          <button class="btn btn-ghost sm" id="clearAllBtn" data-armed="false" title="Delete all captured requests for this endpoint">Clear All</button>
        </div>
        <ul class="request-list" id="requestList"></ul>
      </aside>

      <!-- Right: request inspector -->
      <section class="card detail" id="detailPane"></section>

    </section>
  </main>

  <!-- ======================= Replay modal ======================= -->
  <div class="modal-backdrop" id="replayModal" hidden>
    <div class="card modal" role="dialog" aria-modal="true" aria-labelledby="replayTitle">
      <div class="modal-header">
        <h2 id="replayTitle">Replay Request</h2>
        <button class="icon-btn" id="replayCloseBtn" title="Close" aria-label="Close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p class="modal-sub">Forwards the captured <strong>method, headers and body</strong> to a new target — e.g. another JanHook endpoint or a staging service.</p>
      <label class="field-label" for="replayTarget">Target URL</label>
      <input type="text" id="replayTarget" class="mono" placeholder="http://localhost:8001/h/other-endpoint" spellcheck="false" autocomplete="off">
      <div class="modal-actions">
        <button class="btn btn-ghost" id="replayCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="replaySubmitBtn">Replay →</button>
      </div>
      <div class="replay-result" id="replayResult" hidden>
        <div class="replay-result-bar">
          <span class="replay-status" id="replayStatusBadge"></span>
          <span class="mono muted small" id="replayFinalUrl"></span>
        </div>
        <pre class="mono replay-body" id="replayBody"></pre>
        <div class="replay-result-foot">
          <button class="btn btn-ghost sm" id="replayCopyBtn">Copy response body</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
